services:
  traq:
    image: ghcr.io/traptitech/traq:3.32.1
    environment:
      TRAQ_ORIGIN: http://localhost:3080
      TRAQ_MARIADB_HOST: mariadb
      TRAQ_ES_URL: http://es:9200
      TRAQ_ALLOWSIGNUP: "true"
    command: ["serve", "--dev", "--skip-init-emojis"]
    ports:
      - "3080:3000"
    depends_on:
      mariadb:
        condition: service_healthy
      es:
        condition: service_healthy
  mariadb:
    image: mariadb:10.11.19
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: traq
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: mysql --user=root --password=password --execute "SHOW DATABASES;"
      interval: 2s
      timeout: 10s
      retries: 60
  es:
    image: ghcr.io/traptitech/es-with-sudachi:8.8.1-3.1.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 2s
      timeout: 10s
      retries: 90
  synapse:
    # Only started with `--profile matrix` (testenv/dev.sh); integration tests and CI start the traQ services alone.
    profiles: ["matrix"]
    image: matrixdotorg/synapse:v1.165.0
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      # The image drops to uid 991, which cannot write the root-owned named volume; this is a throwaway dev server.
      UID: "0"
      GID: "0"
    volumes:
      - ./synapse:/config:ro
      - ./.dev:/bridge:ro
      - synapse-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: curl -fsS http://localhost:8008/health || exit 1
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  synapse-data:
