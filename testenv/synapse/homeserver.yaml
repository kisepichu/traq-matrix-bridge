# Synapse for local development of the bridge. Not for production: no federation, no rate limits, SQLite.
server_name: localhost
public_baseurl: http://localhost:8008/
pid_file: /data/homeserver.pid
report_stats: false
suppress_key_server_warning: true
signing_key_path: /data/localhost.signing.key
media_store_path: /data/media_store
log_config: /config/log.config

listeners:
  - port: 8008
    bind_addresses: ["0.0.0.0"]
    type: http
    tls: false
    x_forwarded: false
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

# Users are created with register_new_matrix_user (shared secret); open registration stays off.
enable_registration: false
registration_shared_secret: dev-registration-secret

# Nothing leaves this machine.
federation_domain_whitelist: []
trusted_key_servers: []

# The bridge registrations are generated by testenv/dev.sh into testenv/.dev (mounted at /bridge).
app_service_config_files:
  - /bridge/registration.yaml
  - /bridge/doublepuppet.yaml

# Development scripts send many requests as @dev; do not throttle them.
rc_message: {per_second: 1000, burst_count: 1000}
rc_registration: {per_second: 1000, burst_count: 1000}
rc_login:
  address: {per_second: 1000, burst_count: 1000}
  account: {per_second: 1000, burst_count: 1000}
  failed_attempts: {per_second: 1000, burst_count: 1000}
rc_joins:
  local: {per_second: 1000, burst_count: 1000}
  remote: {per_second: 1000, burst_count: 1000}
rc_invites:
  per_room: {per_second: 1000, burst_count: 1000}
  per_user: {per_second: 1000, burst_count: 1000}
  per_issuer: {per_second: 1000, burst_count: 1000}
