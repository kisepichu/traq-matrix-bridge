name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev
      - run: go vet ./...
      - run: go test -race ./...

  goolm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -tags goolm ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start traQ
        run: docker compose -p tmbit -f testenv/compose.yaml up -d
      - run: go vet -tags integration ./pkg/traq/...
      - run: go test -tags integration -race -count=1 ./pkg/traq/...
      - name: Show the traQ logs
        if: failure()
        run: docker compose -p tmbit -f testenv/compose.yaml logs --no-color --tail=500
      - name: Stop traQ
        if: always()
        run: docker compose -p tmbit -f testenv/compose.yaml down -v

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build
      - run: nix flake check
